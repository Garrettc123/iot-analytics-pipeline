version: '3.8'
services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
  spark-master:
    image: bitnami/spark:3.5.0
    ports:
      - "8081:8080"
  mongodb:
    image: mongo:7.0
  clickhouse:
    image: clickhouse/clickhouse-server:23.11
    ports:
      - "8123:8123"
  airflow:
    build: ./airflow
    ports:
      - "8080:8080"
